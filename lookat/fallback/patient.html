<!doctype html>
<!-- TEAM TEST PAGE, not the design. Served at /patient only while Lea's web/patient.html
     doesn't exist. It shows the raw /api/screen data so gaze and the lamp can be tested. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LookAt test page</title>
<style>
  body { margin: 0; background: #0b1d3f; color: #fff; font: 600 3vh "Segoe UI", system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  .tag { position: fixed; top: 8px; right: 12px; font-size: 1.6vh; color: #9cc8ff; }
  .head { text-align: center; padding: 4vh 2vw 2vh; }
  .badge { color: #9cc8ff; font-size: 2.4vh; letter-spacing: .1em; }
  h1 { font-size: 6vh; margin: 1vh 0; }
  .sub { color: #9cc8ff; }
  .row { flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2vw; padding: 2vh 2vw; }
  .opt { border: 3px solid #3b6fb0; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 4.5vh; padding: 2vh; }
  .opt small { font-size: 2vh; color: #9cc8ff; margin-top: 1vh; }
  .opt.empty { border-style: dashed; opacity: .25; }
  .opt.dwell { border-color: #9cc8ff; box-shadow: 0 0 30px #4d9cff; }
  .opt.asking { background: #1f5fb0; border-color: #fff; }
  .opt.chosen { background: #fff; color: #0b1d3f; }
  .foot { text-align: center; padding: 1vh 2vw 3vh; color: #ffb38a; }
  .overlay { position: fixed; inset: 0; background: rgba(200, 60, 30, .9); display: none; align-items: center; justify-content: center; font-size: 8vh; }
  .warn { color: #ffb38a; }
</style>
</head>
<body>
<div class="tag">TEST PAGE (Lea's design replaces this) · <span id="clock"></span></div>
<div class="head"><div class="badge" id="badge"></div><h1 id="title">Connecting…</h1><div class="sub" id="sub"></div></div>
<div class="row"><div class="opt" id="left"></div><div class="opt" id="middle"></div><div class="opt" id="right"></div></div>
<div class="foot" id="foot"></div>
<div class="overlay" id="overlay"></div>
<script>
const $ = id => document.getElementById(id);
const text = (el, v) => { el.textContent = v == null ? "" : v; };
async function poll() {
  try {
    const d = await (await fetch("/api/screen", {cache: "no-store"})).json();
    text($("badge"), d.badge); text($("title"), d.title); text($("sub"), d.subtitle);
    text($("clock"), d.clock && d.clock.time + (d.clock.demo ? " (demo)" : ""));
    for (const spot of ["left", "middle", "right"]) {
      const el = $(spot), o = d[spot];
      el.className = "opt" + (o ? "" : " empty") + (d.focus && d.focus.spot === spot ? " " + d.focus.state : "");
      el.innerHTML = "";
      if (o) { el.append(o.label); const s = document.createElement("small"); s.textContent = o.hint || ""; el.append(s); }
    }
    let foot = d.footer || (d.show_call_nurse ? "Call Nurse · Long eyebrow raise anywhere" : "");
    if (d.page) foot += `  (page ${d.page.index + 1} of ${d.page.count})`;
    if (d.face === false) foot = "Move into view of the camera. " + foot;
    text($("foot"), foot);
    const ov = $("overlay"), o = d.overlay;
    ov.style.display = o ? "flex" : "none";
    ov.style.background = o && o.kind === "calibrate" ? "#0b1d3f" : "rgba(200, 60, 30, .9)";
    ov.style.justifyContent = o && o.spot === "left" ? "flex-start" : o && o.spot === "right" ? "flex-end" : "center";
    text(ov, o && (o.kind === "calibrate" && o.spot ? "● " + o.text + " ●" : o.text));
  } catch (e) {
    text($("title"), "Can't reach the LookAt program");
  }
  setTimeout(poll, 150);
}
poll();
</script>
</body>
</html>
