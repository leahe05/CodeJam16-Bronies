<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LookAt · Midnight</title>
<!-- Design "Midnight": the calmest one, for night use. Near-black blue, thin lines, a few stars.
     Pop-ups unfold from a single line of light; the countdown is a fine thread of light draining
     while the option's glow fades. Same structure and features as /patient (patient-ui.js). -->
<link rel="stylesheet" href="/web/patient-base.css">
<style>
  :root {
    --bg: radial-gradient(ellipse 120% 90% at 50% 0%, #0b1838, #030817 65%);
    --title-w: 600;
    --hint: #8fb4ee; --icon: #cfe1ff; --brand-icon: #93c5fd;
    --card-bg: rgba(15, 30, 65, .25); --card-border: rgba(147, 197, 253, .32); --card-bw: 1.5px; --card-r: calc(var(--u) * 1.8);
    --dwell-border: #dbeafe; --dwell-glow: 0 0 calc(var(--u) * 2.5) rgba(96, 165, 250, .45);
    --ask-bg: rgba(59, 130, 246, .16); --ask-border: #e0ecff;
    --ask-glow: 0 0 calc(var(--u) * 3) rgba(96, 165, 250, .5), inset 0 0 calc(var(--u) * 3) rgba(96, 165, 250, .25);
    --chosen-flash: rgba(219, 234, 254, .85);
    --ring-w: 2.5; --ring-color: #f0f6ff; --ring-glow: #60a5fa; --ring-track: rgba(147, 197, 253, .1);
    --panel-bg: rgba(8, 18, 42, .6); --panel-border: rgba(147, 197, 253, .25); --panel-r: calc(var(--u) * 2.2); --panel-shadow: none;
    --win-bg: rgba(7, 16, 38, .9); --win-border: rgba(191, 219, 254, .55); --win-blur: 20px;
    --win-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 12) rgba(0, 0, 0, .6), 0 0 calc(var(--u) * 6) rgba(59, 130, 246, .2);
    --home-behind: blur(14px) brightness(.35);
    --pulse: rgba(191, 219, 254, .7);
    --chip-bg: transparent; --chip-border: rgba(147, 197, 253, .4); --chip-text: #bfdbfe;
    --pill-bg: rgba(59, 130, 246, .12); --pill-border: rgba(191, 219, 254, .7); --pill-glow: 0 0 calc(var(--u) * 2.5) rgba(59, 130, 246, .3);
    --bar-bg: transparent; --bar-border: rgba(147, 197, 253, .22);
    --dot: rgba(147, 197, 253, .25); --dot-on: #e0ecff;
    --moon-a: #ffffff; --moon-b: #93c5fd; --moon-glow: rgba(147, 197, 253, .55);
  }
  .opt b, .talk b, .center b { font-weight: 500; }
  .chip { letter-spacing: .22em; font-weight: 500; }
  /* the option's glow fades with the countdown, so the whole card "runs out" smoothly */
  [data-spot].asking { animation: glow-out 3s linear forwards; }
  @keyframes glow-out { from { box-shadow: 0 0 calc(var(--u) * 5) rgba(96, 165, 250, .75), inset 0 0 calc(var(--u) * 4) rgba(96, 165, 250, .4); } }

  /* stars + horizon */
  .stars circle { fill: #dbeafe; }
  .stars .tw { animation: tw 4s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: .2; } }
  .horizon { position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; background: radial-gradient(ellipse 60% 100% at 50% 100%, rgba(59, 130, 246, .16), transparent 70%); }

  /* pop-ups unfold from a line of light */
  @keyframes win-open {
    0% { transform: scaleX(.2) scaleY(.012); opacity: 0; box-shadow: 0 0 calc(var(--u) * 6) #93c5fd; }
    12% { opacity: 1; }
    45% { transform: scaleX(1) scaleY(.012); box-shadow: 0 0 calc(var(--u) * 6) #93c5fd; }
  }
  @keyframes win-close {
    50% { transform: scaleX(1) scaleY(.012); opacity: 1; }
    100% { transform: scaleX(.15) scaleY(.012); opacity: 0; }
  }
  #win.opening .win-in { animation: unfold-in .95s ease-out; }
  @keyframes unfold-in { 0%, 55% { opacity: 0; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <svg class="stars" id="stars" width="100%" height="100%"></svg>
  <div class="horizon"></div>
</div>
<script>
  // a fixed, sparse star field (same every load)
  (function () {
    let s = 7, out = "";
    const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < 70; i++) {
      const r = (rnd() * 1.1 + .3).toFixed(2), o = (rnd() * .5 + .15).toFixed(2);
      out += `<circle cx="${(rnd() * 100).toFixed(2)}%" cy="${(rnd() * 70).toFixed(2)}%" r="${r}" opacity="${o}" class="${i % 5 ? "" : "tw"}" style="animation-delay:${(rnd() * 4).toFixed(1)}s"/>`;
    }
    document.getElementById("stars").innerHTML = out;
  })();
</script>
<script src="/web/lookat.js"></script>
<script src="/web/patient-ui.js"></script>
<script>PatientUI.start();</script>
</body>
</html>
