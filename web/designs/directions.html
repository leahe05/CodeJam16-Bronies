<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LookAt · Directions</title>
<!-- Alternative design "Directions": the screen is split into three equal columns that sit exactly
     where the patient looks (left / center / right). Flat, calm, no glow: fewer distractions and the
     biggest possible targets for coarse gaze. Same data (/api/screen) and logic (/web/lookat.js). -->
<style>
  :root {
    --u: min(1vh, 0.5625vw);
    --bg: #0d1424; --zone: #162033; --line: #2a3a55; --text: #f5f8ff; --muted: #93a4c3;
    --accent: #38d6c3; --accent-strong: #0fa595; --bell: #ff9b85;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden; background: var(--bg); color: var(--text); cursor: none; -webkit-font-smoothing: antialiased;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    display: grid; grid-template-rows: auto auto 1fr auto; gap: calc(var(--u) * 2.4);
    padding: calc(var(--u) * 3) calc(var(--u) * 3.5);
  }
  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  header { display: flex; align-items: center; justify-content: space-between; font-size: calc(var(--u) * 2.2); color: var(--muted); }
  .brand { display: flex; align-items: center; gap: calc(var(--u) * .8); font-weight: 600; color: var(--text); }
  .brand svg { font-size: calc(var(--u) * 3.2); color: var(--accent); }
  .badge { font-size: calc(var(--u) * 1.7); font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  .status { display: flex; align-items: center; gap: calc(var(--u) * .7); }
  .status::before { content: ""; width: calc(var(--u) * 1); height: calc(var(--u) * 1); border-radius: 50%; background: #4ade80; }
  body[data-conn="lost"] .status::before { background: #f59e0b; }

  .question { text-align: center; padding: 0 calc(var(--u) * 6); }
  h1 { margin: 0; font-size: calc(var(--u) * 7); line-height: 1.1; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
  .sub { margin: calc(var(--u) * 1.2) 0 0; font-size: calc(var(--u) * 2.8); color: var(--muted); }
  .footer-line { margin: calc(var(--u) * 1.4) 0 0; font-size: calc(var(--u) * 2.1); color: var(--muted); }

  /* the three gaze zones */
  .zones { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: calc(var(--u) * 2.4); min-height: 0; animation: enter .25s ease-out; }
  @keyframes enter { from { transform: translateY(calc(var(--u) * 1.2)); } }
  .zone {
    position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--u) * 1.6); text-align: center; padding: calc(var(--u) * 3);
    background: var(--zone); border: 3px solid var(--line); border-radius: calc(var(--u) * 3);
  }
  .zone.empty { background: transparent; border: 3px dashed rgba(42, 58, 85, .5); }
  .zone .dir { position: absolute; top: calc(var(--u) * 2); font-size: calc(var(--u) * 1.6); letter-spacing: .2em; color: var(--muted); font-weight: 600; }
  .zone > svg { font-size: calc(var(--u) * 10); color: var(--accent); }
  .zone b { font-size: calc(var(--u) * 5); line-height: 1.1; font-weight: 650; text-wrap: balance; }
  .zone small { font-size: calc(var(--u) * 2); color: var(--muted); }
  .zone.quiet > svg { font-size: calc(var(--u) * 7); color: var(--muted); }
  .zone.quiet b { font-size: calc(var(--u) * 3.6); color: #d7e0f0; }
  .dots { position: absolute; bottom: calc(var(--u) * 2.4); display: flex; gap: calc(var(--u) * 1); }
  .dots i { width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--accent); }

  /* gaze feedback */
  [data-spot] { transition: border-color .2s, background .2s, transform .2s; }
  [data-spot].dwell { border-color: var(--accent); }
  [data-spot].asking { border-color: var(--accent); background: var(--accent-strong); transform: scale(1.015); }
  [data-spot].asking > svg, [data-spot].asking .dir { color: #fff; }
  [data-spot].asking small { color: #fff; font-weight: 700; font-size: calc(var(--u) * 2.6); }
  [data-spot] .bar { position: absolute; left: 0; bottom: 0; height: calc(var(--u) * 1); width: 0; background: #fff; opacity: 0; }
  [data-spot].asking .bar { opacity: .95; animation: shrink 3s linear forwards; }
  @keyframes shrink { from { width: 100%; } to { width: 0; } }
  [data-spot].chosen { animation: chosen .5s ease-out; border-color: #fff; }
  @keyframes chosen { 0% { background: #fff; } 100% { background: var(--accent-strong); } }

  footer { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 1.4); font-size: calc(var(--u) * 2.4); color: var(--muted); }
  footer svg { font-size: calc(var(--u) * 3.2); color: var(--bell); }
  footer b { color: var(--text); font-weight: 600; }
  .gone { visibility: hidden; }

  #overlay { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 2);
    background: #c2412d; text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #overlay.show { opacity: 1; }
  #overlay .ov-icon { font-size: calc(var(--u) * 15); }
  #overlay h1 { font-size: calc(var(--u) * 8.5); }
  #overlay p { margin: 0; font-size: calc(var(--u) * 3.2); }
  #facehint { position: fixed; top: calc(var(--u) * 3); left: 50%; transform: translateX(-50%); z-index: 4; display: none; align-items: center; gap: calc(var(--u) * 1);
    padding: calc(var(--u) * .8) calc(var(--u) * 2.4); border-radius: 99px; background: #fbbf24; color: #111; font-size: calc(var(--u) * 2.2); font-weight: 600; }
  #facehint.show { display: flex; }
  #demotag { position: fixed; right: calc(var(--u) * 1.6); bottom: calc(var(--u) * 1); display: none; font-size: calc(var(--u) * 1.3); letter-spacing: .12em; color: #52627f; }
  #demotag.show { display: block; }
</style>
</head>
<body>
<header id="head"></header>
<section class="question" id="question"></section>
<section class="zones" id="zones"></section>
<footer id="bar"></footer>

<script src="/web/lookat.js"></script>
<script>
const { icon, optIcon, esc, hintTag, bar, dots } = LookAt;
const $ = (id) => document.getElementById(id);
const DIR = { left: "◀ LEFT", middle: "CENTER", right: "RIGHT ▶" };

function zone(d, spot) {
  const o = d[spot];
  if (!o) return `<div class="zone empty"></div>`;
  // "Return / Back / More options" are secondary: drawn quieter so the answers stand out
  const quiet = spot === "middle" && /^(home|back|more)$/.test(o.id || "") ? "quiet" : "";
  const pageDots = spot === "middle" ? dots(d.page) : "";
  return `<div class="zone ${quiet}" data-spot="${spot}"><span class="dir">${DIR[spot]}</span>`
    + `${icon(optIcon(o) || "sparkle")}<b>${esc(o.label)}</b>${hintTag(o, spot)}${pageDots}${bar}</div>`;
}

LookAt.start((d) => {
  const nurse = d.screen === "nurse";
  $("head").innerHTML = `<div class="brand">${icon("eye")}LookAt</div>`
    + `<div class="badge">${esc(d.badge || "")}</div>`
    + (nurse ? `<div class="status">Connected</div>` : `<div></div>`);
  $("question").innerHTML = `<h1>${esc(d.title)}</h1>`
    + (d.subtitle ? `<p class="sub">${esc(d.subtitle)}</p>` : "")
    + (d.footer ? `<p class="footer-line">${esc(d.footer)}</p>` : "");
  $("zones").innerHTML = zone(d, "left") + zone(d, "middle") + zone(d, "right");
  $("zones").style.animation = "none"; void $("zones").offsetWidth; $("zones").style.animation = "";
  $("bar").innerHTML = `${icon("bell")}<b>Call Nurse</b><span>· Long eyebrow raise anywhere</span>`;
  $("bar").classList.toggle("gone", d.show_call_nurse === false);
});
</script>
</body>
</html>
