<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LookAt · Daylight</title>
<!-- Alternative design "Daylight": warm light theme for daytime and bright rooms (a dark navy screen
     looks washed-out grey on a projector when the lights are on). Clean, flat, soft shadows.
     Same data (/api/screen) and logic (/web/lookat.js). -->
<style>
  :root {
    --u: min(1vh, 0.5625vw);
    --bg: #f4efe7; --card: #ffffff; --line: #e4ddd2; --text: #1b2333; --muted: #6b7385;
    --accent: #2f6fec; --accent-soft: #e5edfd; --coral: #d9543f; --coral-soft: #fbe9e5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden; background: var(--bg); color: var(--text); cursor: none; -webkit-font-smoothing: antialiased;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    display: grid; grid-template-rows: calc(var(--u) * 7) 1fr auto; gap: calc(var(--u) * 2);
    padding: calc(var(--u) * 3) calc(var(--u) * 4.5) calc(var(--u) * 3.5);
  }
  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .brand { justify-self: end; display: flex; align-items: center; gap: calc(var(--u) * .8); font-size: calc(var(--u) * 2.8); font-weight: 650; }
  .brand svg { font-size: calc(var(--u) * 3.8); color: var(--accent); }
  .brand.start { justify-self: start; }
  .corner { position: relative; overflow: hidden; justify-self: start; display: flex; align-items: center; gap: calc(var(--u) * 1.3);
    padding: calc(var(--u) * 1.1) calc(var(--u) * 2.4) calc(var(--u) * 1.1) calc(var(--u) * 1.6);
    background: var(--card); border: 2px solid var(--line); border-radius: calc(var(--u) * 1.8); box-shadow: 0 calc(var(--u) * .4) calc(var(--u) * 1.6) rgba(60, 45, 20, .07); }
  .corner svg { font-size: calc(var(--u) * 3.6); color: var(--accent); }
  .corner b { display: block; font-size: calc(var(--u) * 2.2); font-weight: 600; }
  .corner small { display: block; font-size: calc(var(--u) * 1.5); color: var(--muted); }
  .pill { display: flex; align-items: center; gap: calc(var(--u) * 1); padding: calc(var(--u) * .8) calc(var(--u) * 3); border-radius: 99px;
    background: var(--accent-soft); color: var(--accent); font-size: calc(var(--u) * 2.3); font-weight: 600; }
  .pill svg { font-size: calc(var(--u) * 3); }
  .status { justify-self: end; display: flex; align-items: center; gap: calc(var(--u) * .7); font-size: calc(var(--u) * 1.8); color: var(--muted); }
  .status::before { content: ""; width: calc(var(--u) * 1); height: calc(var(--u) * 1); border-radius: 50%; background: #22a35a; }
  body[data-conn="lost"] .status::before { background: #e59e0b; }

  main { display: flex; align-items: center; justify-content: center; min-height: 0; }
  .wrap { width: min(100%, calc(var(--u) * 140)); text-align: center; animation: enter .25s ease-out; }
  @keyframes enter { from { transform: translateY(calc(var(--u) * 1.2)); } }
  .badge { display: inline-flex; align-items: center; gap: calc(var(--u) * .7); margin-bottom: calc(var(--u) * 1.8);
    padding: calc(var(--u) * .5) calc(var(--u) * 1.8); border-radius: 99px; background: var(--accent-soft); color: var(--accent);
    font-size: calc(var(--u) * 1.6); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .badge svg { font-size: calc(var(--u) * 2.2); }
  h1 { margin: 0; font-size: calc(var(--u) * 6.6); line-height: 1.1; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
  .sub { margin: calc(var(--u) * 1.2) 0 0; font-size: calc(var(--u) * 3); color: var(--muted); }
  .hero { font-size: calc(var(--u) * 11); color: #f0a93b; margin-bottom: calc(var(--u) * 1.4); }
  .idle h1 { font-size: calc(var(--u) * 9.5); }

  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 3); margin-top: calc(var(--u) * 4); }
  .opts.one { grid-template-columns: minmax(0, calc(var(--u) * 66)); justify-content: center; }
  .opt, .center, .talk, .instr {
    position: relative; overflow: hidden; background: var(--card); border: 3px solid var(--line);
    box-shadow: 0 calc(var(--u) * .6) calc(var(--u) * 2.4) rgba(60, 45, 20, .08);
  }
  .opt { display: flex; align-items: center; gap: calc(var(--u) * 2.4); text-align: left; min-height: calc(var(--u) * 16);
    padding: calc(var(--u) * 2.2) calc(var(--u) * 3.2); border-radius: calc(var(--u) * 2.6); }
  .opt > svg { font-size: calc(var(--u) * 6.4); color: var(--accent); }
  .opt b { display: block; font-size: calc(var(--u) * 4.6); font-weight: 650; line-height: 1.1; }
  .opt small, .center small, .talk small { display: block; margin-top: calc(var(--u) * .6); font-size: calc(var(--u) * 1.9); color: var(--muted); }
  .center { display: inline-flex; align-items: center; gap: calc(var(--u) * 1.8); margin-top: calc(var(--u) * 2.6);
    padding: calc(var(--u) * 1.3) calc(var(--u) * 4); border-radius: 99px; text-align: left; }
  .center > svg { font-size: calc(var(--u) * 3.6); color: var(--muted); }
  .center b { display: block; font-size: calc(var(--u) * 2.8); font-weight: 600; }
  .talk { display: inline-block; margin-top: calc(var(--u) * 4); padding: calc(var(--u) * 2) calc(var(--u) * 7); border-radius: 99px;
    background: var(--accent); border-color: var(--accent); color: #fff; }
  .talk b { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 1.3); font-size: calc(var(--u) * 4.4); font-weight: 650; }
  .talk small { color: #dbe6ff; }
  .engage { margin-top: calc(var(--u) * 4); }
  .instr { display: flex; align-items: center; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 2.8); padding: calc(var(--u) * 1.6) calc(var(--u) * 3);
    border-radius: calc(var(--u) * 2); text-align: left; font-size: calc(var(--u) * 2.1); color: var(--muted); }
  .instr > svg { font-size: calc(var(--u) * 4); color: var(--coral); }
  .dots { display: flex; justify-content: center; gap: calc(var(--u) * 1.2); margin-top: calc(var(--u) * 2.4); }
  .dots i { width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); border-radius: 50%; background: #d6cec1; }
  .dots i.on { background: var(--accent); }

  /* gaze feedback */
  [data-spot] { transition: border-color .2s, background .2s, box-shadow .2s, transform .2s, color .2s; }
  [data-spot].dwell { border-color: var(--accent); box-shadow: 0 0 0 calc(var(--u) * .8) rgba(47, 111, 236, .18); }
  [data-spot].asking { border-color: var(--accent); background: var(--accent); color: #fff; transform: scale(1.02); }
  [data-spot].asking > svg, [data-spot].asking b svg { color: #fff; }
  [data-spot].asking small { color: #fff; font-weight: 700; }
  [data-spot] .bar { position: absolute; left: 0; bottom: 0; height: calc(var(--u) * .8); width: 0; background: #fff; opacity: 0; }
  [data-spot].asking .bar { opacity: .9; animation: shrink 3s linear forwards; }
  @keyframes shrink { from { width: 100%; } to { width: 0; } }
  [data-spot].chosen { animation: chosen .5s ease-out; }
  @keyframes chosen { 0% { background: #1d4fc4; color: #fff; } 100% { background: var(--accent); color: #fff; } }

  footer { justify-self: center; display: flex; align-items: center; gap: calc(var(--u) * 1.6); padding: calc(var(--u) * 1.4) calc(var(--u) * 4);
    border-radius: 99px; background: var(--coral-soft); color: var(--coral); font-size: calc(var(--u) * 2.4); }
  footer svg { font-size: calc(var(--u) * 3.4); }
  footer b { font-weight: 700; }
  .gone { visibility: hidden; }

  #overlay { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 2);
    background: var(--coral); color: #fff; text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #overlay.show { opacity: 1; }
  #overlay .ov-icon { font-size: calc(var(--u) * 15); }
  #overlay h1 { font-size: calc(var(--u) * 8.5); }
  #overlay p { margin: 0; font-size: calc(var(--u) * 3.2); }
  #facehint { position: fixed; top: calc(var(--u) * 11); left: 50%; transform: translateX(-50%); z-index: 4; display: none; align-items: center; gap: calc(var(--u) * 1);
    padding: calc(var(--u) * .8) calc(var(--u) * 2.4); border-radius: 99px; background: #fff4d6; color: #8a5a00; border: 2px solid #f2cf73; font-size: calc(var(--u) * 2.2); }
  #facehint.show { display: flex; }
  #demotag { position: fixed; right: calc(var(--u) * 1.6); bottom: calc(var(--u) * 1); display: none; font-size: calc(var(--u) * 1.3); letter-spacing: .12em; color: #a89f90; }
  #demotag.show { display: block; }
</style>
</head>
<body>
<header id="head"></header>
<main id="stage"></main>
<footer id="bar"></footer>

<script src="/web/lookat.js"></script>
<script>
const { icon, optIcon, esc, hintTag, bar, dots } = LookAt;
const $ = (id) => document.getElementById(id);

const badge = (d) => d.badge && d.screen !== "nurse" ? `<div class="badge">${icon("sparkle")}${esc(d.badge)}</div>` : "";
const sub = (d) => d.subtitle ? `<p class="sub">${esc(d.subtitle)}</p>` : "";
function card(d, spot) {
  const o = d[spot];
  return o ? `<div class="opt" data-spot="${spot}">${icon(optIcon(o) || "sparkle")}<span><b>${esc(o.label)}</b>${hintTag(o, spot)}</span>${bar}</div>` : "";
}
const cards = (d) => `<div class="opts ${d.left && d.right ? "" : "one"}">${card(d, "left")}${card(d, "right")}</div>`;
const center = (d) => d.middle
  ? `<div><div class="center" data-spot="middle">${icon(optIcon(d.middle) || "home")}<span><b>${esc(d.middle.label)}</b>${hintTag(d.middle, "middle")}</span>${bar}</div></div>` : "";

function body(d) {
  if (d.screen === "idle")
    return `<div class="wrap idle"><div class="hero">${icon("sun")}</div><h1>${esc(d.title)}</h1>${sub(d)}
      ${d.middle ? `<div class="talk" data-spot="middle"><b>${icon(optIcon(d.middle) || "chat")}${esc(d.middle.label)}</b>${hintTag(d.middle, "middle")}${bar}</div>` : ""}</div>`;
  if (d.screen === "suggestion")
    return `<div class="wrap">${badge(d)}<h1>${esc(d.title)}</h1>${sub(d)}
      ${d.middle ? `<div class="talk engage" data-spot="middle"><b>${icon(optIcon(d.middle) || "target")}${esc(d.middle.label)}</b>${bar}</div>` : ""}</div>`;
  if (d.screen === "nurse")
    return `<div class="wrap"><h1>${esc(d.title)}</h1>${sub(d)}${cards(d)}
      <div class="instr" ${d.middle ? 'data-spot="middle"' : ""}>${icon("brows")}<span>${esc(d.footer || "Look left or right and raise your eyebrows to choose.")}</span>${bar}</div>${dots(d.page)}</div>`;
  return `<div class="wrap">${badge(d)}<h1>${esc(d.title)}</h1>${sub(d)}${cards(d)}${center(d)}${dots(d.page)}</div>`;
}

function head(d) {
  const brand = (cls) => `<div class="brand ${cls}">${icon("eye")}LookAt</div>`;
  if (d.screen === "nurse")
    return `${brand("start")}<div class="pill">${icon("nurse")}${esc(d.badge || "From your nurse")}</div><div class="status">Connected</div>`;
  const corner = (d.screen === "idle" || d.screen === "suggestion") && d.left
    ? `<div class="corner" data-spot="left">${icon(optIcon(d.left) || "lamp")}<span><b>${esc(d.left.label)}</b>${hintTag(d.left, "left")}</span>${bar}</div>` : "<div></div>";
  return `${corner}<div></div>${brand("")}`;
}

$("bar").innerHTML = `${icon("bell")}<b>Call Nurse</b><span>· Long eyebrow raise anywhere</span>`;
LookAt.start((d) => {
  $("head").innerHTML = head(d);
  $("stage").innerHTML = body(d);
  $("bar").classList.toggle("gone", d.show_call_nurse === false);
});
</script>
</body>
</html>
